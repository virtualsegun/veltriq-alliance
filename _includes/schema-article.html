<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BlogPosting",
  "headline": {{ page.title | jsonify }},
  "description": {{ page.description | strip_html | jsonify }},
  "datePublished": "{{ page.date | date_to_xmlschema }}",
  "dateModified": "{{ page.last_modified_at | default: page.date | date_to_xmlschema }}",
  "author": { "@type": "Organization", "name": {{ page.author | jsonify }} },
  "publisher": {
    "@type": "Organization",
    "@id": "{{ '/' | absolute_url }}#organization",
    "name": "Veltriq Alliance",
    "logo": { "@type": "ImageObject", "url": "{{ '/assets/img/logo.png' | absolute_url }}" }
  },
  "image": "{% if page.image %}{{ page.image | absolute_url }}{% else %}{{ '/assets/img/og-image.jpg' | absolute_url }}{% endif %}",
  "mainEntityOfPage": "{{ page.url | absolute_url }}",
  "articleSection": {{ page.category | jsonify }}
}
</script>
