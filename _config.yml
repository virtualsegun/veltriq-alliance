# Site settings for GitHub Pages (Jekyll).
title: Veltriq Alliance
description: IT systems integration, managed support, datacenter and infrastructure, networking and cyber security for businesses in Lagos and across Nigeria.
url: https://www.veltriqalliance.com.ng
baseurl: ""
timezone: Africa/Lagos

markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true

plugins:
  - jekyll-feed
  - jekyll-sitemap

feed:
  path: blog/feed.xml

# Blog posts live in _posts/ and are published at /blog/<post-title>/.
# (Set here rather than as the site-wide permalink, which would also move
# services.html etc. to /services/.)
defaults:
  - scope:
      path: ""
      type: posts
    values:
      permalink: /blog/:title/
      layout: post
      author: Veltriq Alliance Team

exclude:
  - README.md
  - BLOG-GUIDE.md
  - tools/
